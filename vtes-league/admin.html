<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lega Barghigiana 2026 - Inserimento Dati</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="./image.png" alt="VTES Logo" class="logo" />
        <h1>Lega Barghigiana 2026</h1>
      </div>

      <div class="section">
        <h2>Aggiungi Giocatore</h2>
        <div class="input-group">
          <input
            type="text"
            id="participantName"
            placeholder="Nome giocatore"
          />
          <button id="addParticipant">Aggiungi</button>
        </div>
      </div>

      <div class="section">
        <h2>Inserisci Punteggi</h2>
        <div class="input-group">
          <select id="participantSelect">
            <option value="">Seleziona giocatore...</option>
          </select>
          <select id="daySelect">
            <option value="">Seleziona giorno...</option>
          </select>
          <input type="number" id="gwInput" placeholder="GW" min="0" step="1" />
          <input
            type="number"
            id="vpInput"
            placeholder="VP"
            min="0"
            step="0.5"
          />
          <button id="addScore">Salva Punteggio</button>
        </div>
      </div>

      <div class="section">
        <h2>Gestione Dati</h2>
        <div class="button-group">
          <button id="exportData">Esporta Dati</button>
          <button id="importData">Importa Dati</button>
          <button id="clearData" class="danger">Cancella Tutti i Dati</button>
        </div>
        <input
          type="file"
          id="importFile"
          accept=".json"
          style="display: none"
        />
      </div>

      <div class="section">
        <h2>Riepilogo Punteggi</h2>
        <div id="scoreDetails"></div>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
