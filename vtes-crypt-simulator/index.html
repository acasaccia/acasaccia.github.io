<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V:TES Crypt Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">
      <h1>V:TES Crypt Draw Simulator</h1>
      <div id="kofi-container">
        <script
          type="text/javascript"
          src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"
        ></script>
        <script type="text/javascript">
          kofiwidget2.init("Support me on Ko-fi", "#72a4f2", "X8X31ZEU4T");
          kofiwidget2.draw();
        </script>
      </div>
    </div>

    <div class="container">
      <div>
        <label for="input">Deck List (from vdb.im):</label>
        <textarea
          id="input"
          placeholder="Enter your full deck export or just the crypt section...

Example:

Crypt (12 cards, min=24 max=28 avg=6.5)
=======================================
2x Aline Gädeke   7 POT PRE cel   baron   Brujah:6
1x Rayne          2 pot                   Brujah:6

Library section will be ignored."
        ></textarea>
      </div>

      <div>
        <label for="output">Simulation Results:</label>
        <div id="output"></div>
      </div>

      <div>
        <label for="query">Query your opening hand:</label>
        <div class="query-section">
          <textarea
            id="query"
            class="query-input"
            rows="3"
            placeholder="at least 2 distinct where title = baron&#10;&#10;at least 1 where clan = Brujah and capacity >= 7"
          ></textarea>
          <p class="query-help">
            Use <strong>at least N distinct where</strong> followed by filters
            joined with <strong>and</strong>. Filters: title, clan, discipline,
            capacity &gt;= N, capacity &lt;= N. Uppercase disciplines such as
            <strong>POT</strong> require superior; lowercase
            <strong>pot</strong> allows either level.
          </p>

          <button id="calculateQuery" class="btn btn-primary">
            Calculate Probability
          </button>
          <button id="clearQuery" class="btn btn-secondary">Clear</button>
        </div>
        <div id="queryResult"></div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
